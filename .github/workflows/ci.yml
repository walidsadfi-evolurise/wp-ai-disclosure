name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.0", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: composer test
      - name: Syntax check every PHP file
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check assets/ai-disclosure.js && node --check block/editor.js
  package:
    runs-on: ubuntu-latest
    needs: [php, js]
    steps:
      - uses: actions/checkout@v4
      - name: Build distributable zip
        run: |
          mkdir -p dist/wp-ai-disclosure
          cp -r wp-ai-disclosure.php uninstall.php readme.txt LICENSE includes assets block languages dist/wp-ai-disclosure/
          cd dist && zip -qr wp-ai-disclosure.zip wp-ai-disclosure
      - uses: actions/upload-artifact@v4
        with:
          name: wp-ai-disclosure
          path: dist/wp-ai-disclosure.zip
